server {
    listen 80;
    listen [::]:80;
    server_name nikitaabashevst.fvds.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nikitaabashevst.fvds.ru;

    ssl_certificate /etc/letsencrypt/live/nikitaabashevst.fvds.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikitaabashevst.fvds.ru/privkey.pem;
    ssl_session_cache shared:volnoyebot_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/volnoyebot;
    index index.html;

    location = /test {
        return 302 /test/fishing.html;
    }

    location = /test/fishing.html {
        alias /var/www/volnoyebot-test/fishing.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /test/ {
        alias /var/www/volnoyebot-test/;
        index fishing.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
